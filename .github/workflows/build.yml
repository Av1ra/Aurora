name: Aurora development build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: python -m pip install numpy Pillow pyinstaller
      - name: Core checks
        run: dotnet run --project Aurora.Tests -c Release
      - name: Viewport boundary checks
        run: node Packaging/test-viewport.mjs
      - name: OBJ and native alpha-glass streams
        run: python Packaging/test-obj-glass.py
      - name: Build development packages, never a release
        shell: pwsh
        run: ./build.ps1 -Development
      - name: Native installer and signed package checks
        shell: pwsh
        run: |
          $build = Get-Content artifacts/latest-build.txt -Raw
          python Packaging/test-native.py "$build/package/app/Aurora.Installer.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Native installer test failed' }
          python Packaging/test-package.py "$build/output"
          if ($LASTEXITCODE -ne 0) { throw 'Adjacent archive test failed' }
          python Packaging/test-brand.py "$build/package" "$build/output/Aurora-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Executable icon/backend test failed' }
          dotnet run --project Aurora.UpdateTests -c Release -- "$build/package/app/Assets/publisher.pem" "$build/output"
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-0.2-Launcher-and-Editor-${{ github.sha }}
          path: artifacts/build-*/output/*
          retention-days: 7
          if-no-files-found: error
